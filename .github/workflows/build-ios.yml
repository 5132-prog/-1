name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, for device)
        run: |
          set -o pipefail
          xcodebuild \
            -project RuZhInterpreter.xcodeproj \
            -scheme RuZhInterpreter \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tail -n 40

      - name: Package unsigned ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/RuZhInterpreter.app Payload/
          zip -qr RuZhInterpreter-unsigned.ipa Payload

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: RuZhInterpreter-ipa
          path: RuZhInterpreter-unsigned.ipa
          retention-days: 30
